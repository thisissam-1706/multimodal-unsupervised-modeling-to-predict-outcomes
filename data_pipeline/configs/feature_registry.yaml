# Phase 1 feature registry (plan section 4). ONE ENTRY PER FIELD.
#
#   status: verified | dropped, with `reason`. Set by `python data_pipeline/src/coverage.py --update-registry`
#           after checking the entry against the real v2.0.0 files (exists, units, range, coverage). Never edited to hide a failure.
#   source: exact selector string in the real data (measurement_source_value / observation_source_value). Observation strings are
#           truncated to 49 characters in the source files themselves. plan_source = string used by the plan/stub, kept for traceability.
#   range:  clinical plausibility bounds [lo, hi], fixed before modelling. Values outside become empty cells with reason qc_failed.
#   since:  first handoff version that includes the entry (1 = v1, 2 = v2). v1 is rebuilt from the entries with since <= 1.
#   hold:   explicit decision to keep an entry in the registry but not build it (status dropped, reason = the hold text).
#   codebook: what was found about the item's response labels (none are in the local payload) and how its codes are treated.
#   candidates: plan-listed fields NOT in the primary registry. They are never built until the user approves them.
# Never add: study_group, recommended_split, ids, dates, clinical_site, modality flags, mhterm_*, mh_dm_age, mh_a1c, cmtrt_*, paid*, dml*,
# diabetes diagnosis / medication rows.
version: 3
release: v2.0.0
inclusion:
  min_participant_coverage_for_additions: 0.8
  applies_to_entries_since: 2
  rule: An entry added after v1 stays in the registry only if it is verified (exact source exists, unit consistent) AND has a usable value aligned
    to the index visit for at least this share of participants; otherwise it is marked dropped with the reason. Fixed before any modelling.
features:
- name: bmi
  group: anthropometry
  kind: numeric
  dtype: float
  unit: kg/m2
  range: [10, 80]
  table: measurement
  source: bmi_vsorres, BMI
  plan_source: bmi_vsorres
  label: BMI
  omop:
    selector_column: measurement_source_value
    value_column: value_as_number
    unit_column: unit_source_value
    date_column: measurement_date
    visit_column: visit_occurrence_id
  temporal_rule: 'Assessment-visit measurement. Attached through visit_occurrence_id (visit type 9202) when that visit starts on study_visit_date,
    otherwise same calendar day as study_visit_date. Rows dated after study_visit_date are rejected. Repeats: median of valid rows.'
  missingness: Measured at nearly every visit; absence is not_collected. Zero or implausible values are instrument/entry errors and become empty
    (qc_failed), never 0.
  leakage: Body-habitus phenotype measured at the visit; not a diagnosis, group-defining answer or treatment field. Associated with the target
    legitimately. Derived fields (BMI, WHR) are redundant with height/weight/waist/hip, not leaks. Derived by the site from height and weight.
  codebook: n/a (measurement with a unit in the source or its label)
  since: 1
  status: verified
  reason: exact source found (1,065 rows, 1,065 participants); unit blank in source; usable aligned value for 1,064 of 1,067 participants (99.7%);
    1 rows outside the plausible range or flagged Invalid
