    when the id is unresolved. Completion before the index date inside the same encounter is kept; after the index date is rejected. Conflicting
    repeats leave the cell empty (qc_failed).
  missingness: Absent when the instrument was not completed or skipped by instrument logic (not_collected); non-substantive answers 555/777/888
    are kept as response codes, not treated as missing.
  leakage: 'Self-reported SDOH / lifestyle answer, not a diagnosis, treatment, or group-defining item (those, e.g. mhterm_*, cmtrt_*, dml*, paid*,
    are excluded). May proxy recruitment balance (site, education); a limitation, not a leak. Instrument: optional SDOH / diet item (plan section
    4). Computed diet score (range about -20 to 17). Not reproducible from diet1-diet9 as coded (many identical item patterns map to different
    scores), so its derivation is unknown; the plan says keep it distinct from the items and do not assume it is a validated outcome. Treated
    as a numeric score because its label says so. VALUE COLUMN: value_as_number is EMPTY for every negative score (644 of 991 rows) while value_as_string
    holds all values (-20 to 17), so the full value is read from value_as_string and parsed as a number; value_as_number would silently keep only
    the non-negative scores.'
  codebook: Numeric value; no codebook needed except units/range (not local; bounds are plausibility limits).
  since: 2
  hold: 'HELD OUT of v2: a numeric score legitimately takes the values -1, -9 and other negatives, which the contract validator rejects as missing-value
    sentinels (-1, -9, -99, -999, -9999; INTERFACE.md: missing is never -1). The score is also not reproducible from diet1-diet9 and has no local
    codebook. Re-enable only if the contract exempts declared score features (needs your decision), or after the derivation is known.'
