# Model selection search space (task B5). Read by modeling/src/model_select.py.
# Selection metric: VALIDATION macro-F1 only. The test split is never loaded.
handoff_dir: handoff/mock        # change to handoff/v1 when Person A releases it

ae:
  base_config: modeling/configs/ae.yaml   # everything not in the grid comes from here
  seeds: [0, 1, 2]                        # each config is trained once per seed; score = mean
  grid:                                   # full cross product; dotted keys index into ae.yaml
    model.hidden: [[256, 128], [128, 64]]
    model.dropout: [0.1, 0.3]
    finetune.weight_decay: [1.0e-4, 1.0e-3]
    pretrain.mask_rate: [0.2, 0.4]
    finetune.lr: [5.0e-4, 1.0e-3]

logreg:
  seeds: [0]
  grid:
    C: [0.01, 0.1, 1.0, 10.0]

hgb:
  seeds: [0, 1, 2]
  grid:
    max_depth: [3, 6]
    learning_rate: [0.05, 0.1]

calibration:
  ae: temperature        # one scalar T fitted on val log-probabilities
  logreg: isotonic       # one-vs-rest isotonic on val, rows renormalized
  hgb: isotonic
