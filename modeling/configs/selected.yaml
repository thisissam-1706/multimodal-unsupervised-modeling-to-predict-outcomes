# Two parts. (1) `cv_selection` below: the PROPOSED final choice, picked by repeated CV on train+val
# from modeling/reports/cv_comparison.md (hand-written from that report, 2026-11-19). (2) `ae`,
# `logreg`, `hgb`: the earlier single-validation-split selection written by modeling/src/model_select.py,
# kept unchanged (final_run.py and its tests read them) but SUPERSEDED for model choice.
# Re-running model_select.py would overwrite this file. final_run.py does not know `cv_selection` yet.
locked: false
date: '2026-11-19'
handoff_dir: handoff/v1
schema_version: v1
selection_metric: cv_macro_f1_mean   # legacy blocks below were chosen on val_macro_f1_mean
class_order:
- healthy
- pre_diabetes_lifestyle_controlled
- oral_medication_and_or_non_insulin_injectable_medication_controlled
- insulin_dependent
mock_data: false
cv_selection:
  status: proposed; not locked; to be agreed with Person A at S2
  source: modeling/reports/cv_comparison.md (generated by modeling/src/cv_report.py)
  protocol: StratifiedKFold(5) x cv_seeds on train+val pooled (907 rows); every imputer, scaler,
    vocabulary and model fitted inside each fold's training part; test split never loaded
  cv_folds: 5
  cv_seeds:
  - 0
  - 1
  - 2
  rule: highest mean CV macro-F1 among all 29 model x feature-set rows tried (ranking is noisy, see selection.md)
  feature_set:
    name: A_clinical
    config: modeling/configs/feature_sets.yaml
    n_features: 24
    description: all non-survey features; no survey items or scores
    featurizer_mode: tree   # raw numerics, NaN handled natively; no imputation, scaling or indicators
  model:
    name: hgb_monotone
    factory: modeling/src/models.py hgb_monotone(max_depth=2)
    kind: cumulative ordinal (Frank & Hall), 3 binary HistGradientBoosting models for P(y>k)
    params:
      max_depth: 2
      learning_rate: 0.05
      max_iter: 200
      min_samples_leaf: 20
      l2_regularization: 1.0
      early_stopping: false
    sample_weight: balanced 4-class weights, shared by the three binary fits
    monotone_increasing:
    - hba1c
    - glucose
    seeds:
    - 0   # HGB without subsampling is deterministic; the seed has no effect
  threshold_offsets:
    method: none
    offsets:   # additive log-prior offsets, class order as in contracts/INTERFACE.md
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    reason: nested-CV offsets did not help (hgb_monotone_d2+bias macro-F1 0.486 vs 0.499 without;
      pre-diabetes recall fell 0.408 -> 0.360); not adopted
  cv_result:   # mean +- std over 15 folds
    macro_f1: [0.499, 0.042]
    accuracy: [0.525, 0.035]
    balanced_accuracy: [0.506, 0.048]
    adjacent_accuracy: [0.895, 0.015]
    qwk: [0.602, 0.042]
    log_loss: [1.365, 0.224]
    recall_per_class: [0.600, 0.408, 0.533, 0.481]
    reference: logreg_C1 on A_clinical (macro-F1 0.464 +- 0.053, log-loss 1.168)
    paired_macro_f1_vs_reference: [0.035, 0.045]   # mean, std; model better in 12/15 folds
  alternatives_for_s2:
  - name: ordinal_logit C=0.1 on A_clinical
    macro_f1: [0.480, 0.043]
    log_loss: [1.213, 0.136]
    why: better calibrated, simpler; within noise of the reference
  - name: logreg C=1 on A_clinical (reference)
    macro_f1: [0.464, 0.053]
    log_loss: [1.168, 0.101]
  final_fit: proposed on train+val (907 rows); final_run.py currently refits on train only
  calibration: not decided for this model (old calibrators were fitted on val)
ae:
  config:
    seed: 0
    handoff_dir: handoff/mock
    model:
      hidden:
      - 256
      - 128
      latent: 64
      head_hidden: 32
      dropout: 0.1
      activation: relu
    pretrain:
      epochs: 100
      lr: 0.001
      weight_decay: 1.0e-05
      batch_size: 64
      mask_rate: 0.2
      huber_delta: 1.0
    finetune:
      epochs: 200
      lr: 0.0005
      weight_decay: 0.001
      batch_size: 64
      patience: 20
      recon_weight: 0.0
  seeds:
  - 0
  - 1
  - 2
  grid_params:
    model.hidden:
    - 256
    - 128
    model.dropout: 0.1
    finetune.weight_decay: 0.001
    pretrain.mask_rate: 0.2
    finetune.lr: 0.0005
  best_epochs:
  - 12
  - 18
  - 5
  val_macro_f1_mean: 0.5402071403704344
  val_macro_f1_std: 0.017770973452586145
  calibration:
    method: temperature
    temperature: 1.3303873616022108
logreg:
  params:
    C: 0.01
  seeds:
  - 0
  val_macro_f1_mean: 0.5054439755932293
  val_macro_f1_std: 0.0
  calibration:
    method: isotonic
    artifact: modeling/artifacts/calibrators.joblib
hgb:
  params:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 15
    max_depth: 3
    l2_regularization: 1.0
  seeds:
  - 0
  - 1
  - 2
  val_macro_f1_mean: 0.4178055826189308
  val_macro_f1_std: 0.0
  calibration:
    method: isotonic
    artifact: modeling/artifacts/calibrators.joblib
note: 'Calibration fitted and scored on the same val rows: optimistic. Test split
  never loaded during selection.'
